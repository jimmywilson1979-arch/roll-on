      const sl = (sv || []).slice().sort((a, b) => (b.mine - a.mine) || brit(a) - brit(b) || a.name.localeCompare(b.name));
      const stTxt = !st ? "Checking the studio voices…" : st.ready ? "✅ Studio voices are ready" : "⚠️ Studio voices aren't available right now. Using this device's voice.";
      d.innerHTML = `<div><h2 style="margin:0">🗣️ Narrator</h2>
        <label class="vrow"><input type="checkbox" id="von" ${NARR.on ? "checked" : ""}> Read everything out loud</label>
        <div class="vseg"><button class="btn ${cloud ? "gold" : ""}" data-eng="cloud">⭐ Studio voice</button><button class="btn ${cloud ? "" : "gold"}" data-eng="device">📱 This device's voice</button></div>
        ${cloud ? `<p class="muted" style="margin:0;font-size:.85em">${stTxt}</p>
          ${sl.length ? `<label>Voice<select id="csel">${sl.map(v => `<option value="${esc(v.id)}" ${v.id === NARR.cvoice ? "selected" : ""}>${v.mine ? "💛 " : ""}${esc(v.name)}${v.accent ? ` · ${esc(v.accent)}` : ""}${v.gender ? ` · ${esc(v.gender)}` : ""}</option>`).join("")}</select></label>
          <div class="vseg"><button class="btn ${NARR.cmodel === "quick" ? "gold" : ""}" data-mod="quick">⚡ Quick (goes further)</button><button class="btn ${NARR.cmodel === "best" ? "gold" : ""}" data-mod="best">🎭 Best</button></div>` : ""}`
        : vs.length ? `<label>Voice <span class="muted">(⭐ = better quality)</span><select id="vsel">${vs.map(v => `<option value="${esc(v.name)}" ${v.name === NARR.voice ? "selected" : ""}>${NARR.good(v) ? "⭐ " : ""}${esc(v.name)} · ${esc(v.lang)}</option>`).join("")}</select></label>` : `<p class="muted">This device hasn't given us any voices yet.</p>`}
        <label>Speed <input type="range" id="vrate" min="0.7" max="1.4" step="0.05" value="${NARR.rate}"></label>
        <div style="display:flex;gap:.6em"><button class="btn" id="vtest">▶️ Test voice</button><button class="btn gold" id="vok">Done</button></div></div>`;
      const q = s => d.querySelector(s);
      if (q("#csel")) q("#csel").onchange = e => { NARR.setCvoice(e.target.value); NARR.test(); };
      if (q("#vsel")) q("#vsel").onchange = e => { NARR.setVoice(e.target.value); NARR.test(); };
      d.querySelectorAll("[data-eng]").forEach(b => b.onclick = () => { NARR.setEngine(b.dataset.eng); paint(); });
      d.querySelectorAll("[data-mod]").forEach(b => b.onclick = () => { NARR.setCmodel(b.dataset.mod); paint(); NARR.test(); });
      q("#vrate").oninput = e => NARR.setRate(+e.target.value);
      q("#vtest").onclick = () => NARR.test();
      q("#von").onchange = e => { if (e.target.checked !== NARR.on) NARR.toggle(); $("#narr").textContent = NARR.on ? "🗣️ Narrator" : "🤐 Narrator"; };
      q("#vok").onclick = () => d.remove();
    };
    d.onclick = e => { if (e.target === d) d.remove(); };
    paint();
    NARR.status(true).then(r => { st = r; if (r.ready) return NARR.studio().then(v => { sv = v; }); }).then(() => { if (d.isConnected) paint(); });
  }
  addEventListener("resize", () => { lastBuild = ""; render(); });
  addEventListener("click", () => { SFX.unlock(); const w = $("#wake"); if (w) w.hidden = true; });
  render();
  try { link = await connect(room, onMsg, s => { const c = s === "ok" ? (LOCAL ? "Local test mode" : "") : "Connection lost. Reload if phones stop working."; if (c !== conn) { conn = c; lastBuild = ""; render(); } }); }
  catch (e) { conn = "Couldn't connect. Check the internet and reload."; }
  lastBuild = ""; push();
}

// ======================================================================
// Phone
// ======================================================================
async function phoneMain(codeRaw) {
  document.body.className = "ph th-jungle";
  const room = String(codeRaw || "").toUpperCase().replace(/[^A-Z]/g, "").slice(0, 4);

  const id = ls.get(KID, null) || uid(); ls.set(KID, id);

  const send = m => link && link.send(Object.assign({ id }, m));
  const act = a => { send({ t: "act", a }); vib(15); };
  const mp = () => S && S.players[id];

  function joinForm() {
    lastKey = "join";
    app.innerHTML = `<div class="home"><h1><small>ROLL ON</small>Snakes &amp; Ladders</h1><p class="muted" style="text-align:center">Game ${esc(room)}</p>
      <input id="nm" maxlength="14" placeholder="Your name" value="${esc(me ? me.name : "")}">
      <label class="card" style="display:flex;gap:.7em;align-items:flex-start"><input type="checkbox" id="kid" style="width:auto;margin-top:.3em" ${me && me.kid ? "checked" : ""}><span>🧒 <b>A child is playing</b><br><span class="muted" style="font-size:.9em">Shows what's coming up ahead, and reads out your power-ups.</span></span></label>

  addEventListener("devicemotion", e => { const a = e.accelerationIncludingGravity; if (!a || a.x == null) return; if (lastA) { const d = Math.abs(a.x - lastA.x) + Math.abs(a.y - lastA.y) + Math.abs(a.z - lastA.z); if (d > 26 && now() - lastShake > 1500 && canRoll() && S.boost !== "pick" && !aim) { lastShake = now(); doRoll(); } } lastA = { x: a.x, y: a.y, z: a.z }; });

  function onMsg(m) {

    if (m.t === "state") {
      const first = !S; S = m.st; setTheme(S.settings.theme);
      if (me && !S.players[id] && !watch) send({ t: "join", name: me.name, kid: me.kid });
      if (first) lastFx = S.fxN || 0;

      prevCards = cards; PV = m.p; render(); return;

  }
  function cardsHTML(canPlay) {

    const t = L.t(S), cs = myCards();
    return `<div class="card"><h3>🃏 My power-ups (${cs.length}/${L.MAXCARDS})</h3>${cs.length ? `<div class="pcards">${cs.map((c, i) => { const C = L.CARDS[c]; return `<div class="pcard"><span class="ci">${C.icon}</span><span>${esc(C.name)}<small>${esc(C.txt(t))}</small></span>${c === "shield" ? `<span class="btn" style="background:#e8f5e9;color:#1b5e20;border-color:#a5d6a7">Ready</span>` : canPlay ? `<button class="btn gold" data-card="${i}">Play</button>` : ""}</div>`; }).join("")}</div>${canPlay ? `<p class="muted" style="margin:.5em 0 0;font-size:.85rem">You can play one card before you roll.</p>` : ""}` : `<p class="muted" style="margin:0">Land on a ${t.star} to get a power-up card.</p>`}</div>`;
  }
  function body() {
    const p = mp(), t = L.t(S);
    if (S.phase === "lobby") return `<div class="card cc">${tokHTML(S, p, "ptok big")}<h2 style="margin-top:.5em">You're the ${esc(pieceOf(S, p)[2])}!</h2><p class="muted" style="margin:0">${p.kid ? "🧒 Child player" : "Grown-up player"} · <button id="edit" style="text-decoration:underline;color:var(--muted)">change</button></p></div>
      ${S.host === id ? `<div class="card"><h3>⭐ You're the host</h3>${L.SETTINGS().map(([k, label, vals]) => `<div class="setrow"><b>${label}</b>${vals.map(([x, l]) => `<button class="chip ${S.settings[k] === x ? "on" : ""}" data-set="${k}" data-val="${x}">${esc(l)}</button>`).join("")}</div>`).join("")}<button class="btn gold big" id="start" style="margin-top:.6em">Start the game</button></div>` : `<div class="card cc">Waiting for ${esc((S.players[S.host] || {}).name || "the host")} to start.</div>`}

      out.push(`<div class="card hot"><h2 class="cc">${C.icon} ${esc(C.name)}</h2><p class="muted cc" style="margin:.2em 0 .7em">${aim.c === "swap" ? "Who do you want to swap places with?" : aim.c === "push" ? "Who do you want to push back 5 squares?" : "Who do you want to freeze?"}</p><div class="tlist">${S.order.filter(x => x !== id).sort((a, b) => S.players[b].pos - S.players[a].pos).map(x => { const q = S.players[x], to = Math.max(0, q.pos - 5), sn = aim.c === "push" && L.snakeAt(S, to); return `<button data-target="${x}">${tokHTML(S, q, "ptok")}<span style="flex:1">${esc(q.name)}<br><small class="muted">square ${q.pos || "start"}${aim.c === "push" ? ` → ${to}${sn ? ` ${t.key === "space" ? "🕳️" : t.key === "xmas" ? "❄️" : "🐍"} ${t.down}!` : L.ladderAt(S, to) ? ` (a ${t.up}, careful!)` : ""}` : ""}</small></span></button>`; }).join("")}</div><button class="btn big" id="cancel" style="margin-top:.7em">Back</button></div>`);

  function wire() {

}

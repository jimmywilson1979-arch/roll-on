<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2a1840">
<title>Roll On · Mystery</title>
<meta name="description" content="Family whodunnit on the TV. Search the house, question witnesses, keep your clues secret on your phone.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Nunito:wght@600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="art.js?v=3"></script>
<script src="mys-engine.js?v=4"></script>
<script src="mys-art.js?v=3"></script>
<style>
:root{--bg:#2a1840;--bg2:#120a20;--paper:#fbf3e0;--paper2:#efe0bd;--ink:#2b1d12;--accent:#ffc94a;--fg:#fff;--muted:#cdbfe6;--panel:rgba(0,0,0,.3);--line:rgba(255,255,255,.16);--good:#3ddc84;--bad:#ff5d5d;--title:"Special Elite","Courier New",monospace;--body:"Nunito",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg),var(--bg2) 80%);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
body.ph,body.home-b{overflow:auto}
body.tvb{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--fg);background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:12px;padding:.8em .9em;width:100%}
.muted{color:var(--muted)}.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border-radius:14px;padding:.75em 1.1em;font-weight:800;font-size:1rem;background:rgba(255,255,255,.1);border:2px solid var(--line);line-height:1.15;text-align:center}
.btn.gold{background:var(--accent);color:#2a1b00;border-color:var(--accent)}
.btn.good{background:var(--good);color:#04210f;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#2a0000;border-color:var(--bad)}
.btn.big{font-size:1.15rem;padding:.9em 1.1em;width:100%}
.btn:disabled{opacity:.4}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.42em .75em;border-radius:99px;border:2px solid var(--line);background:rgba(0,0,0,.25);font-weight:800;font-size:.88rem}
.chip.on{background:var(--accent);color:#2a1b00;border-color:var(--accent)}
.setrow{display:flex;flex-wrap:wrap;gap:.35em;margin:.3em 0}.setrow b{width:100%;font-size:.8em;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dot{display:inline-block;width:1em;height:1em;border-radius:50%;box-shadow:0 0 0 2px #fff;flex:none}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--accent);color:#2a1b00;padding:.6em 1.1em;border-radius:99px;font-weight:900;z-index:99;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.home{max-width:520px;margin:0 auto;padding:6vh 1.2em 2em;display:flex;flex-direction:column;gap:1em;min-height:100vh}
.home h1{font-family:var(--title);font-size:clamp(2.4rem,10vw,3.6rem);margin:0;line-height:1;text-align:center}
.home h1 small{display:block;font-family:var(--body);font-size:.3em;letter-spacing:.3em;color:var(--accent);margin-bottom:.4em}
/* TV — sizes in --u (1% of the visible height, set by fit()) */
.tv{display:grid;grid-template-columns:auto 1fr;height:calc(100*var(--u,1vh));width:100vw;gap:calc(1.6*var(--u,1vh));padding:calc(1.6*var(--u,1vh))}
.bwrap{position:relative;width:var(--bw,120vh);height:var(--bh,94vh)}
.house{position:absolute;inset:0;display:grid;gap:calc(1*var(--u,1vh));padding:calc(1.4*var(--u,1vh));background:#5b3a22;border-radius:calc(2*var(--u,1vh));border:calc(.6*var(--u,1vh)) solid #3a2414;box-shadow:inset 0 0 0 calc(.5*var(--u,1vh)) #7a5232}
.room{position:relative;background:linear-gradient(160deg,var(--paper),var(--paper2));color:var(--ink);border-radius:calc(1.2*var(--u,1vh));padding:calc(1.4*var(--u,1vh));display:flex;flex-direction:column;overflow:hidden}
.room .ri{font-size:calc(6*var(--u,1vh));line-height:1}
.room .rn{font-family:var(--title);font-size:calc(3*var(--u,1vh));margin-top:calc(.6*var(--u,1vh))}
.room .rs{font-weight:800;font-size:calc(1.7*var(--u,1vh));opacity:.75;margin-top:calc(.4*var(--u,1vh))}
.room .who{position:absolute;right:calc(1.2*var(--u,1vh));bottom:calc(1.2*var(--u,1vh));display:flex;gap:calc(.6*var(--u,1vh))}
.room .who i{width:calc(3.6*var(--u,1vh));height:calc(3.6*var(--u,1vh));border-radius:50%;box-shadow:0 0 0 calc(.3*var(--u,1vh)) #fff,0 calc(.4*var(--u,1vh)) calc(1*var(--u,1vh)) rgba(0,0,0,.4)}
.room.here{box-shadow:0 0 0 calc(.6*var(--u,1vh)) var(--accent)}
.room.locked{filter:grayscale(.8) brightness(.7)}
.room.locked::after{content:"🔒 Locked";position:absolute;inset:auto 0 40% 0;text-align:center;font-family:var(--title);font-size:calc(3.4*var(--u,1vh));color:#7a1010}
.spots{display:flex;gap:calc(.6*var(--u,1vh));margin-top:auto;font-size:calc(2.6*var(--u,1vh))}
.scene{position:absolute;inset:0;z-index:5;background:linear-gradient(160deg,var(--paper),var(--paper2));color:var(--ink);border-radius:calc(2*var(--u,1vh));border:calc(.6*var(--u,1vh)) solid #3a2414;display:flex;flex-direction:column;align-items:center;padding:calc(3*var(--u,1vh));animation:zoom .5s;text-align:center}
@keyframes zoom{from{transform:scale(.4);opacity:0}}
.scene h2{font-family:var(--title);font-size:calc(6*var(--u,1vh));margin:0;line-height:1}
.scene .big{font-size:calc(12*var(--u,1vh));line-height:1}
.spotrow{display:flex;gap:calc(2*var(--u,1vh));margin:calc(3*var(--u,1vh)) 0;justify-content:center;flex-wrap:wrap}
.spotrow>div{width:calc(22*var(--u,1vh));background:#fff;border-radius:calc(1.6*var(--u,1vh));padding:calc(1.6*var(--u,1vh));border:calc(.4*var(--u,1vh)) dashed #c9a34a;font-weight:900;font-size:calc(2.2*var(--u,1vh))}
.spotrow>div .hi{font-size:calc(7*var(--u,1vh));line-height:1.1}
.spotrow>div.done{border-style:solid;border-color:#bbb;opacity:.75}
.spotrow>div .by{display:flex;gap:calc(.4*var(--u,1vh));justify-content:center;margin-top:calc(.6*var(--u,1vh));min-height:calc(1.8*var(--u,1vh))}
.spotrow>div .by i{width:calc(1.8*var(--u,1vh));height:calc(1.8*var(--u,1vh));border-radius:50%}
.say{font-weight:900;font-size:calc(3*var(--u,1vh));line-height:1.25;max-width:90%}
.say small{display:block;font-weight:700;font-size:.7em;opacity:.75;margin-top:.3em}
.trio{display:flex;gap:calc(2*var(--u,1vh));justify-content:center;margin:calc(2*var(--u,1vh)) 0}
.ccard{width:calc(18*var(--u,1vh));background:#fff;color:var(--ink);border-radius:calc(1.4*var(--u,1vh));padding:calc(1.4*var(--u,1vh));border:calc(.4*var(--u,1vh)) solid var(--ink);font-weight:900;font-size:calc(2*var(--u,1vh));box-shadow:0 calc(.8*var(--u,1vh)) calc(2*var(--u,1vh)) rgba(0,0,0,.3)}
.ccard .ci{font-size:calc(7*var(--u,1vh));line-height:1.1}
.ccard small{display:block;font-size:.65em;opacity:.6;letter-spacing:.1em}
.ccard.flip{animation:flip .7s both}
@keyframes flip{from{transform:rotateY(90deg)}}
.resp{display:flex;gap:calc(1.2*var(--u,1vh));justify-content:center;flex-wrap:wrap;font-weight:800;font-size:calc(2*var(--u,1vh))}
.resp span{padding:calc(.6*var(--u,1vh)) calc(1.2*var(--u,1vh));border-radius:99px;background:rgba(0,0,0,.08)}
.side{display:flex;flex-direction:column;gap:calc(1.3*var(--u,1vh));min-width:0;min-height:0}
.shead{display:flex;align-items:center;gap:1.4vh}
.shead .ttl{font-family:var(--title);font-size:calc(4*var(--u,1vh));line-height:1}
.shead .code{margin-left:auto;text-align:right;font-size:calc(1.6*var(--u,1vh));color:var(--muted);font-weight:800}
.shead .code b{display:block;font-size:calc(3.6*var(--u,1vh));color:var(--fg);letter-spacing:.12em}
.panel{background:var(--panel);border:calc(.25*var(--u,1vh)) solid var(--line);border-radius:calc(1.6*var(--u,1vh));padding:calc(1.4*var(--u,1vh))}
.plist{display:flex;flex-direction:column;gap:calc(.8*var(--u,1vh))}
.prow{display:flex;align-items:center;gap:calc(1.1*var(--u,1vh));background:var(--panel);border:calc(.25*var(--u,1vh)) solid var(--line);border-radius:calc(1.3*var(--u,1vh));padding:calc(.9*var(--u,1vh)) calc(1.2*var(--u,1vh));font-weight:800;font-size:calc(2*var(--u,1vh))}
.prow.turn{border-color:var(--accent);background:rgba(255,255,255,.14)}
.prow .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn small{display:block;font-size:.72em;color:var(--muted)}
.race{font-weight:900;font-size:calc(1.6*var(--u,1vh));opacity:.85;margin:calc(.6*var(--u,1vh)) 0 calc(-.2*var(--u,1vh))}
.meter{height:calc(.9*var(--u,1vh));border-radius:99px;background:rgba(255,255,255,.15);margin-top:calc(.5*var(--u,1vh));overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;transition:width .8s ease}
.meter.hot{box-shadow:0 0 calc(1*var(--u,1vh)) #ffb347}
.cap{position:absolute;left:50%;top:calc(1.5*var(--u,1vh));transform:translate(-50%,-150%);max-width:88%;z-index:30;background:rgba(20,10,4,.86);color:#fff6e0;border:calc(.25*var(--u,1vh)) solid rgba(255,220,160,.45);border-radius:calc(1.6*var(--u,1vh));padding:calc(1*var(--u,1vh)) calc(2*var(--u,1vh));font-weight:800;font-size:calc(2.3*var(--u,1vh));text-align:center;opacity:0;transition:transform .35s ease,opacity .35s;pointer-events:none}
.cap.show{transform:translate(-50%,0);opacity:1}
.wake{position:absolute;left:50%;bottom:calc(3*var(--u,1vh));transform:translateX(-50%);z-index:31;font-size:calc(2.4*var(--u,1vh))}
.wake[hidden]{display:none}
.prow .dot{width:calc(2.6*var(--u,1vh));height:calc(2.6*var(--u,1vh))}
.info{display:flex;gap:1vh;flex-wrap:wrap}.info span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:calc(.5*var(--u,1vh)) calc(1.3*var(--u,1vh));font-weight:800;font-size:calc(1.8*var(--u,1vh))}
.feed{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:calc(.6*var(--u,1vh));font-size:calc(1.75*var(--u,1vh));font-weight:700;color:var(--muted);mask-image:linear-gradient(transparent,#000 40%)}
.feed div:last-child{color:var(--fg)}
.tvctl{display:flex;gap:calc(.8*var(--u,1vh));flex-wrap:wrap}.tvctl .btn{font-size:calc(1.5*var(--u,1vh));padding:calc(.7*var(--u,1vh)) calc(1.2*var(--u,1vh))}
.lobbyside{font-size:calc(1.8*var(--u,1vh))}.lobbyside .chip{font-size:calc(1.6*var(--u,1vh))}
.over{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(10,5,20,.7);animation:fade .4s;border-radius:calc(2*var(--u,1vh))}
.over .box{background:var(--paper);color:var(--ink);border-radius:calc(2*var(--u,1vh));padding:calc(3*var(--u,1vh));text-align:center;max-width:90%;border:calc(.5*var(--u,1vh)) solid var(--accent)}
.over h2{font-family:var(--title);font-size:calc(5.4*var(--u,1vh));margin:0}
.over p{font-weight:800;font-size:calc(2.4*var(--u,1vh))}
@keyframes fade{from{opacity:0}}
.qrbox{background:#fff;padding:calc(1.2*var(--u,1vh));border-radius:calc(1.2*var(--u,1vh));display:inline-block}
.qrbox img,.qrbox canvas{display:block;width:calc(26*var(--u,1vh))!important;height:calc(26*var(--u,1vh))!important}
/* ---- 🎨 Storybook look: painted pictures (img/mystery, via mys-art.js). Classic = without .fx ---- */
.art{width:1.15em;height:1.15em;display:inline-block;vertical-align:middle;overflow:visible}
.pic{width:1.15em;height:1.15em;display:inline-block;vertical-align:middle;object-fit:contain;-webkit-user-drag:none}
.pic-s,.pic-r{object-fit:cover;border-radius:18%;box-shadow:0 0 0 .08em #fff8e6,0 .06em .14em rgba(0,0,0,.35)}
.fx body.tvb{background:#3a2414 url(img/mystery/background.jpg) center/cover}
.fx .side .panel,.fx .side .prow,.fx .info span{background:rgba(30,16,8,.72);border-color:rgba(255,220,160,.22)}
.fx .feed{background:rgba(30,16,8,.55);border-radius:calc(1.4*var(--u,1vh));padding:calc(1*var(--u,1vh))}
.fx .house{background:linear-gradient(#7a5232,#5b3a22);box-shadow:0 0 0 calc(.4*var(--u,1vh)) #d9b45a,0 0 0 calc(1*var(--u,1vh)) #3a2414,0 calc(2*var(--u,1vh)) calc(5*var(--u,1vh)) rgba(0,0,0,.6);border-color:#4a2c14}
.room.photo{padding:0;background-size:cover;background-position:center;box-shadow:inset 0 0 0 calc(.3*var(--u,1vh)) rgba(0,0,0,.35)}
.room.photo .lbl{position:absolute;left:calc(1*var(--u,1vh));top:calc(1*var(--u,1vh));background:rgba(255,248,230,.92);border-radius:calc(1*var(--u,1vh));padding:calc(.3*var(--u,1vh)) calc(1.2*var(--u,1vh));font-family:var(--title);font-size:calc(2.8*var(--u,1vh));box-shadow:0 calc(.3*var(--u,1vh)) calc(.8*var(--u,1vh)) rgba(0,0,0,.3)}
.room.photo .lbl small{display:block;font-family:var(--body);font-weight:800;font-size:.55em;opacity:.75}
.room.photo.here{box-shadow:0 0 0 calc(.6*var(--u,1vh)) var(--accent),0 0 calc(3*var(--u,1vh)) var(--accent)}
.room.photo.locked::after{background:rgba(20,10,5,.45);inset:0;display:grid;place-items:center;color:#ffd77a;text-shadow:0 .3vh .6vh #000}
.scene.photo{padding:0;background-size:cover;background-position:center;border-color:#3a2414;overflow:hidden}
.scene.photo .top,.scene.photo .bot{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:calc(.6*var(--u,1vh));padding:calc(1.4*var(--u,1vh))}
.scene.photo .top{top:0;background:linear-gradient(rgba(20,10,5,.75),transparent)}
.scene.photo .bot{bottom:0;background:linear-gradient(transparent,rgba(20,10,5,.85) 30%);padding-top:calc(5*var(--u,1vh))}
.scene.photo h2{color:#fff3d6;text-shadow:0 .3vh .8vh #000;font-size:calc(4.2*var(--u,1vh))}
.scene.photo .say{color:#fff;text-shadow:0 .2vh .6vh #000}
.scene.photo.dim::before{content:"";position:absolute;inset:0;background:rgba(20,10,5,.62);z-index:0}
.scene.photo>*{position:relative;z-index:1}.scene.photo .top,.scene.photo .bot,.scene.photo>.hs{position:absolute}
.scene .info span{color:#fff3d6;background:rgba(30,16,8,.8)}
.scene.photo .resp span{color:#fff;background:rgba(20,10,5,.6)}
.hs{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:calc(.4*var(--u,1vh));z-index:2}
.hs .ring{width:calc(8*var(--u,1vh));height:calc(8*var(--u,1vh));border-radius:50%;border:calc(.6*var(--u,1vh)) solid #ffd77a;box-shadow:0 0 calc(2*var(--u,1vh)) #ffd77a,inset 0 0 calc(1.5*var(--u,1vh)) #ffd77a;animation:glowr 1.1s ease-in-out infinite alternate}
@keyframes glowr{to{transform:scale(1.12);box-shadow:0 0 calc(3.5*var(--u,1vh)) #ffe9a8,inset 0 0 calc(2*var(--u,1vh)) #ffe9a8}}
.hs .tag{background:rgba(255,248,230,.95);color:var(--ink);font-weight:900;font-size:calc(1.9*var(--u,1vh));border-radius:99px;padding:calc(.2*var(--u,1vh)) calc(1*var(--u,1vh));display:flex;gap:calc(.4*var(--u,1vh));align-items:center;white-space:nowrap}
.hs .tag i{width:calc(1.5*var(--u,1vh));height:calc(1.5*var(--u,1vh));border-radius:50%;display:inline-block}
.hs.done .ring{border-color:rgba(255,255,255,.55);box-shadow:none;animation:none;background:rgba(0,0,0,.25)}
.hs.now .ring{border-color:#7dff9a;box-shadow:0 0 calc(4*var(--u,1vh)) #7dff9a;animation:pop2 .6s}
@keyframes pop2{from{transform:scale(1.8)}}
.fx .ccard{background:linear-gradient(#fffdf6,#f3e5c2);border-color:#5a3714;box-shadow:inset 0 0 0 calc(.5*var(--u,1vh)) #fffdf6,inset 0 0 0 calc(.8*var(--u,1vh)) #c9a34a,0 calc(.8*var(--u,1vh)) calc(2*var(--u,1vh)) rgba(0,0,0,.35)}
.fx .ccard .ci{font-size:calc(9*var(--u,1vh))}
.ccard .pic{width:100%;height:auto;aspect-ratio:1;margin:calc(.4*var(--u,1vh)) 0}
.cback{width:calc(14*var(--u,1vh));aspect-ratio:360/537;border-radius:calc(1.2*var(--u,1vh));background:url(img/mystery/extra-cardback.jpg) center/cover;box-shadow:0 calc(.8*var(--u,1vh)) calc(2*var(--u,1vh)) rgba(0,0,0,.4);animation:wob .5s ease-in-out infinite alternate}
.cback:nth-child(2){animation-delay:.15s}.cback:nth-child(3){animation-delay:.3s}
@keyframes wob{to{transform:translateY(calc(-1*var(--u,1vh))) rotate(2deg)}}
.fx .over .box{background:linear-gradient(#fdf6e3,#eedcae);box-shadow:inset 0 0 0 calc(.6*var(--u,1vh)) #fdf6e3,inset 0 0 0 calc(1*var(--u,1vh)) #c9a34a}
.fx .pick .pi{font-size:2.6rem}
.pick .pic-s,.pick .pic-r{width:100%;height:auto;aspect-ratio:1;border-radius:10px}
.fx .clue{background:linear-gradient(#fffdf6,#f3e5c2);box-shadow:inset 0 0 0 3px #c9a34a}
.fx .clue .ci{font-size:3.6rem}
.proom{position:relative;width:100%;aspect-ratio:1;border-radius:16px;background-size:cover;background-position:center;margin:.3em 0 .6em;box-shadow:inset 0 0 0 3px rgba(255,220,160,.4)}
.proom .hs{font-size:1rem}
.proom .hs .ring{width:3.4rem;height:3.4rem;border-width:4px}
.proom .hs .tag{font-size:.85rem;padding:.15em .6em}
.proom button.hs{background:none;border:0;padding:0}
/* phone */
.pw{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto}
.ptop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6em;padding:.7em .9em;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ptop .nm{font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmain{flex:1;padding:1em .9em 6.5em;display:flex;flex-direction:column;gap:.9em}
.ptabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.ptabs button{flex:1;padding:.75em .2em .8em;font-weight:800;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.1em}
.ptabs button b{font-size:1.4rem}.ptabs button.on{color:var(--fg);background:rgba(255,255,255,.08)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:1em}
.card.hot{border-color:var(--accent)}.card.red{border-color:var(--bad)}
.card h2{margin:0 0 .3em;font-size:1.3rem}.card h3{margin:0 0 .4em;font-size:1.05rem}
.cc{text-align:center}.bigemoji{font-size:4.2rem;line-height:1.1}
.clue{background:var(--paper);color:var(--ink);border-radius:16px;padding:.9em 1em;display:flex;gap:.8em;align-items:center;font-weight:800;line-height:1.3}
.clue .ci{font-size:3rem;line-height:1}

  }
  function effect(f) {
    if (f.k === "turn" && f.pid === id) { vib([80, 60, 80]); toast("🔎 Your turn, detective!"); tab = "play"; }
    if (f.k === "tip") { toast("🔎 Detective's tip! Check your notebook."); }
    if (f.k === "solved") vib([100, 50, 100, 50, 200]);
  }
  setInterval(() => send({ t: "hi" }), 5000);

  const clueText = f => { if (!f) return ""; if (f.t !== "clue") return f.txt || ""; const c = M.card(S, f.c); return (f.by ? `${S.players[f.by] ? S.players[f.by].name : "Someone"} secretly showed you: ${c.name}. ` : f.witness ? "The witness says: " : f.accuse ? "One part of your accusation was wrong: " : "") + c.clue; };
  const srcText = v => !v ? "" : v === "hand" ? "your card" : v === "found" ? "you found it" : v === "witness" ? "a witness" : v === "tip" ? "detective's tip" : v === "accuse" ? "wrong accusation" : v.startsWith("shown:") ? "shown by " + ((S.players[v.slice(6)] || {}).name || "?") : "";
  const known = () => (PV && PV.known) || {};
  const left = k => M.cards(S).filter(c => c[0] === k && !known()[c]);

  function render() {
    if (!me || (watch && !S?.players[id])) { if (lastKey !== "join") joinForm(); return; }
    const p = mp();
    const key = !S ? "wait" : !p ? "joining" : JSON.stringify([S.phase, S.step, S.turnPid, S.rollN, S.searches, S.bonus, p.room, p.guessed, p.skip, S.unlocked, S.ask && [S.ask.results, S.ask.waiting], PV, tab, mode, pickS, pickR, pickI, marks, S.settings, S.order.length, S.host, S.paused, S.spots && Object.values(S.spots).map(s => s.by.length).join("")]);
    if (key === lastKey) return; lastKey = key;
    if (!S) { app.innerHTML = `<div class="home" style="justify-content:center;text-align:center"><div class="bigemoji">🔍</div><h2>Finding the TV…</h2><p class="muted">Make sure the TV screen is on game ${esc(room)}.</p></div>`; return; }
    if (!p) { app.innerHTML = `<div class="home" style="justify-content:center;text-align:center"><div class="bigemoji">🔍</div><h2>Joining…</h2></div>`; return; }
    const inPlay = S.phase === "play";
    app.innerHTML = `<div class="pw"><div class="ptop"><span class="dot" style="background:${p.color};width:1.4em;height:1.4em"></span><span class="nm">🕵️ ${esc(p.name)}${S.host === id ? " ⭐" : ""}</span>${S.host === id && inPlay ? `<button id="gear" style="font-size:1.3rem">⚙️</button>` : ""}</div>
      <div class="pmain">${body()}</div>${inPlay ? `<div class="ptabs">${[["play", "🔍", "Play"], ["book", "📒", "Notebook"]].map(([k, i, l]) => `<button class="${tab === k ? "on" : ""}" data-tab="${k}"><b>${i}</b>${l}</button>`).join("")}</div>` : ""}</div>`;
    wire();
  }
  function counts() { const s = left("s").length, r = left("r").length, i = left("i").length; return `<div class="count"><span>👤 ${s} suspect${s > 1 ? "s" : ""}</span><span>🏠 ${r} room${r > 1 ? "s" : ""}</span><span>🍴 ${i} thing${i > 1 ? "s" : ""}</span></div>`; }
  function body() {
    const p = mp(), s = M.st(S);
    if (S.phase === "lobby") return `<div class="card cc"><div class="bigemoji">🕵️</div><h2>You're a detective!</h2><p class="muted" style="margin:0">${p.kid ? "🧒 Child player · clues read aloud" : "Grown-up player"} · <button id="edit" style="text-decoration:underline;color:var(--muted)">change</button></p></div>
      ${S.host === id ? `<div class="card"><h3>⭐ You're the host</h3>${M.SETTINGS().map(([k, label, vals]) => `<div class="setrow"><b>${label}</b>${vals.map(([x, l]) => `<button class="chip ${S.settings[k] === x ? "on" : ""}" data-set="${k}" data-val="${x}">${esc(l)}</button>`).join("")}</div>`).join("")}<button class="btn gold big" id="start" style="margin-top:.6em">Start the mystery</button></div>` : `<div class="card cc">Waiting for ${esc((S.players[S.host] || {}).name || "the host")} to start.</div>`}
      <div class="card">${RULES}</div>${window.ART ? `<button class="btn" id="plook">🎨 Pictures: ${ART.on ? "Storybook" : "Classic"}</button>` : ""}<button class="btn" id="leave">Leave</button>`;
    if (S.phase === "end") { const sol = S.sol, w = S.result && S.result.winner; return `<div class="card cc hot"><div class="bigemoji">${w === id ? "🏆" : "🎂"}</div><h2>${w === id ? "You solved it!" : w ? `${esc(S.players[w].name)} solved it!` : "Case closed"}</h2><p style="font-weight:800">${esc(s.reveal(M.card(S, sol.s).name, M.card(S, sol.r).name, M.card(S, sol.i).name))}</p><button class="btn" id="sayit">🔊 Read it out</button></div>${S.host === id ? `<button class="btn gold big" id="again">▶ New mystery</button><button class="btn big" id="tolobby">Back to the lobby</button>` : ""}`; }
    if (S.paused) return `<div class="card cc"><div class="bigemoji">⏸️</div><h2>Paused</h2></div>`;
    if (tab === "book") return notebook();
    return play();
  }
  function play() {
    const p = mp(), s = M.st(S), cur = S.players[S.turnPid], myTurn = S.turnPid === id, out = [];
    const f = PV && PV.found && now() - PV.found.at < 60000 ? PV.found : null;
    // must show a card?
    if (PV && PV.mustShow) {
      const ms = PV.mustShow;
      out.push(`<div class="card hot cc"><h2>🃏 ${esc(S.players[ms.from].name)} asks you!</h2><p style="font-weight:800">Was it ${esc(M.card(S, ms.s).name)}, in the ${esc(M.card(S, ms.r).name)}, with the ${esc(M.card(S, ms.i).name)}?</p><p class="muted">You have ${ms.options.length > 1 ? "more than one of these. Pick one to show secretly" : "this one. Show it secretly"}:</p><div class="grid2">${ms.options.map(c => { const x = M.card(S, c); return `<button class="pick" data-show="${c}"><span class="pi">${cardIc(S, c)}</span>${esc(x.name)}</button>`; }).join("")}</div></div>`);
      return out.join("");
    }
    if (myTurn && mode === "guess") return guessPicker(false);
    if (myTurn && mode === "accuse") return guessPicker(true);
    if (myTurn) {
      if (S.step === "roll") out.push(`<div class="card hot cc"><h2>🔎 Your turn, detective!</h2><div class="pdie shake" id="pdie">${dieHTML(S.die || 1)}</div><button class="btn gold big" id="roll">Tap to roll</button><p class="muted" style="margin:.5em 0 0">…or shake your phone!</p></div>`);
      if (S.step === "room") out.push(`<div class="card hot"><h2 class="cc">You rolled ${S.die}: ${S.searches} search${S.searches > 1 ? "es" : ""}${S.bonus ? " + a witness 👀" : ""}</h2><p class="muted cc" style="margin:.2em 0 .7em">Which room do you want to search?</p><div class="grid2">${M.rooms(S).map(r => { const w = s.where[r], open = M.roomOpen(S, r), left2 = [0, 1, 2].filter(k => !S.spots[r + ":" + k].by.includes(id)).length; return `<button class="pick ${open ? "" : "lock"} ${known()["r" + r] ? "x" : ""}" ${open ? `data-room="${r}"` : ""}><span class="pi">${open ? ic("r" + r, w[0]) : "🔒"}</span>${esc(w[1])}<span class="src">${open ? `${left2} spot${left2 === 1 ? "" : "s"} left for you` : "find the key"}</span></button>`; }).join("")}</div></div>`);
      if (S.step === "asking" || S.step === "showing") out.push(`<div class="card cc"><div class="bigemoji">🤔</div><h2>Waiting for an answer…</h2><p class="muted">${S.ask && S.ask.waiting ? esc(S.players[S.ask.waiting].name) + " is choosing a card to show you." : ""}</p></div>`);
      if (S.step === "search") {
        const w = s.where[p.room];
        if (f) out.push(foundHTML(f));
        out.push(`<div class="card hot"><h2 class="cc">${w[0]} The ${esc(w[1])}</h2><p class="muted cc" style="margin:.2em 0 .7em">${S.searches ? `Tap a hiding spot to search (${S.searches} left)` : "No searches left this turn"}</p>${window.MART && MART.img("r" + p.room) ? `<div class="proom" style="background-image:url(${MART.img("r" + p.room)})">${w[3].map((h, k) => { const done = S.spots[p.room + ":" + k].by.includes(id), [x, y] = MART.spots(p.room)[k]; return `<button class="hs ${done ? "done" : ""}" ${!done && S.searches ? `data-search="${k}"` : ""} style="left:${x}%;top:${y}%"><span class="ring"></span><span class="tag">${done ? "✖ " : ""}${esc(h[1])}</span></button>`; }).join("")}</div>`
          : `<div class="grid3">${w[3].map((h, k) => { const done = S.spots[p.room + ":" + k].by.includes(id); return `<button class="pick ${done ? "x" : ""}" ${!done && S.searches ? `data-search="${k}"` : ""}><span class="pi">${ic("spot" + p.room + ":" + k, h[0])}</span>${esc(h[1])}</button>`; }).join("")}</div>`}
          ${S.bonus ? `<button class="btn big" id="witness" style="margin-top:.7em">👀 Talk to a witness</button>` : ""}
          <div class="grid2" style="margin-top:.7em">${p.guessed ? `<button class="btn" disabled>🤔 Guess used</button>` : `<button class="btn gold" id="guess">🤔 Make a guess</button>`}<button class="btn" id="accuse">☝️ Accuse!</button></div>
          <button class="btn big" id="endturn" style="margin-top:.6em">End my turn ➜</button></div>`);
        out.push(`<div class="card">${counts()}${helpHTML()}</div>`);
      }
    } else {
      const doing = S.step === "roll" ? "is about to roll" : S.step === "room" ? "is choosing a room" : S.step === "asking" || S.step === "showing" ? "is asking a question" : `is searching the ${s.where[cur.room] ? s.where[cur.room][1] : ""}`;
      out.push(`<div class="card cc"><span class="dot" style="background:${cur.color};width:2.4em;height:2.4em"></span><h2 style="margin-top:.4em">${esc(cur.name)}'s turn</h2><p class="muted" style="margin:0">${esc(cur.name)} ${doing}.</p>${p.skip ? `<p style="font-weight:800">🪑 You're on the naughty step for ${p.skip} more turn${p.skip > 1 ? "s" : ""}.</p>` : ""}</div>`);
      if (f) out.push(foundHTML(f));
      out.push(`<div class="card">${counts()}${helpHTML()}<button class="btn big" data-tab="book" style="margin-top:.7em">📒 Open my notebook</button></div>`);
    }
    return out.join("");
  }
  function foundHTML(f) {
    if (f.t === "clue") { const c = M.card(S, f.c), txt = clueText(f); return `<div class="clue"><span class="ci">${cardIc(S, f.c)}</span><span>${esc(txt)}<br><small style="opacity:.7">✖ ${esc(c.name)} crossed off your notebook</small></span><button class="say" data-say="${esc(txt)}">🔊</button></div>`; }
    if (f.t === "key") return `<div class="clue"><span class="ci">${ic("key", "🔑")}</span><span>You found the key! The ${esc(M.st(S).where[S.locked][1])} is open now.</span></div>`;
    if (f.t === "mag") return `<div class="clue"><span class="ci">${ic("mag", "🔍")}</span><span>A magnifying glass! You get one more search.</span></div>`;
    return `<div class="clue"><span class="ci">${ic("dust", "🕸️")}</span><span>${esc(f.txt || "Nothing here.")}</span><button class="say" data-say="${esc(f.txt || "Nothing here.")}">🔊</button></div>`;
  }
  function helpHTML() {
    const s = left("s"), r = left("r"), i = left("i");
    if (s.length === 1 && r.length === 1 && i.length === 1) return `<div class="clue" style="margin-top:.7em"><span class="ci">💡</span><span>You've worked it out! It must be ${esc(M.card(S, s[0]).name)}, in the ${esc(M.card(S, r[0]).name)}, with the ${esc(M.card(S, i[0]).name)}. ${S.turnPid === id ? "Press Accuse!" : "Accuse on your turn!"}</span></div>`;
    if (!mp().kid) return "";
    const tip = r.length > 1 ? `Go to a room that isn't crossed off and make a guess there.` : `You know WHERE it happened! Go to the ${M.card(S, r[0]).name} and make guesses.`;
    return `<p style="margin:.6em 0 0;font-weight:700">💡 ${esc(tip)}</p>`;
  }
  function guessPicker(isAcc) {
    const p = mp(), s = M.st(S), list = (k, sel) => M.cards(S).filter(c => c[0] === k).map(c => { const x = M.card(S, c); return `<button class="pick ${sel === c ? "on" : ""} ${known()[c] ? "x" : ""}" data-p${k}="${c}"><span class="pi">${cardIc(S, c)}</span>${esc(x.name)}</button>`; }).join("");
    const room = "r" + p.room, ready = pickS && pickI && (!isAcc || pickR);
    return `<div class="card hot"><h2 class="cc">${isAcc ? "☝️ Accuse!" : "🤔 Make a guess"}</h2><p class="muted cc" style="margin:.2em 0 .6em">${isAcc ? "If you're right, you win. If you're wrong, it's the naughty step for 2 turns!" : `In the ${esc(s.where[p.room][1])}. Pick who and with what. Crossed-out ones are already ruled out.`}</p>
      <h3>👤 Who?</h3><div class="grid3">${list("s", pickS)}</div>
      ${isAcc ? `<h3 style="margin-top:.7em">🏠 Where?</h3><div class="grid3">${list("r", pickR)}</div>` : ""}
      <h3 style="margin-top:.7em">🍴 With what?</h3><div class="grid3">${list("i", pickI)}</div>
      <button class="btn ${isAcc ? "bad" : "gold"} big" id="send" style="margin-top:.8em" ${ready ? "" : "disabled"}>${isAcc ? "☝️ I accuse them!" : "Ask the others"}</button><button class="btn big" id="cancel" style="margin-top:.5em">Back</button></div>`;
  }
  function notebook() {
    const s = M.st(S), k = known();
    const sec = (kind, title) => `<h3>${title}</h3><div class="grid3">${M.cards(S).filter(c => c[0] === kind).map(c => { const x = M.card(S, c), v = k[c]; return `<button class="pick ${v ? "x" : ""} ${marks[c] && !v ? "mark" : ""}" data-mark="${c}"><span class="pi">${cardIc(S, c)}</span>${esc(x.name)}<span class="src">${v ? esc(srcText(v)) : "still possible"}</span></button>`; }).join("")}</div>`;
    const clues = Object.keys(k).map(c => { const x = M.card(S, c); return `<div class="clue" style="margin-top:.5em"><span class="ci" style="font-size:2.2rem">${cardIc(S, c)}</span><span style="font-size:.95rem">${esc(x.clue)}<br><small style="opacity:.65">${esc(srcText(k[c]))}</small></span><button class="say" data-say="${esc(x.clue)}">🔊</button></div>`; }).join("");
    return `<div class="card nb">${counts()}<p class="muted cc" style="font-size:.85rem;margin:.5em 0 0">✖ = ruled out. Tap a card to give it your own ⭐ "I suspect this" mark.</p>${sec("s", "👤 Who?")}${sec("r", "🏠 Where?")}${sec("i", "🍴 With what?")}</div>
      <div class="card"><h3>🗂️ My clues (${Object.keys(k).length})</h3>${clues || `<span class="muted">No clues yet. Go searching!</span>`}</div>`;
  }
  function wire() {
    const on = (s, f) => { const e = $(s); if (e) e.onclick = f; };
    $$("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; mode = null; lastKey = ""; render(); scrollTo(0, 0); });
    $$("[data-set]").forEach(b => b.onclick = () => { const v = b.dataset.val; act({ t: "set", k: b.dataset.set, v: isNaN(v) ? v : Number(v) }); });
    on("#start", () => act({ t: "start" })); on("#again", () => act({ t: "again" })); on("#tolobby", () => act({ t: "lobby" }));
    on("#edit", () => { lastKey = ""; me = null; joinForm(); me = ls.get(KME, null); });
    on("#leave", () => { send({ t: "leave" }); ls.del(KME); me = null; lastKey = ""; render(); });
    on("#roll", () => { askMotion(); doRoll(); });
    on("#plook", () => { ART.toggle(); lastKey = ""; render(); });
    $$("[data-room]").forEach(b => b.onclick = () => act({ t: "room", r: +b.dataset.room }));
    $$("[data-search]").forEach(b => b.onclick = () => act({ t: "search", k: +b.dataset.search }));
    on("#witness", () => act({ t: "witness" }));
    on("#guess", () => { mode = "guess"; pickS = pickI = null; pickR = "r" + mp().room; lastKey = ""; render(); scrollTo(0, 0); });
    on("#accuse", () => { mode = "accuse"; const l = k => left(k).length === 1 ? left(k)[0] : null; pickS = l("s"); pickR = l("r"); pickI = l("i"); lastKey = ""; render(); scrollTo(0, 0); });
    on("#cancel", () => { mode = null; lastKey = ""; render(); });
    $$("[data-ps]").forEach(b => b.onclick = () => { pickS = b.dataset.ps; lastKey = ""; render(); });
    $$("[data-pr]").forEach(b => b.onclick = () => { pickR = b.dataset.pr; lastKey = ""; render(); });
    $$("[data-pi]").forEach(b => b.onclick = () => { pickI = b.dataset.pi; lastKey = ""; render(); });
    on("#send", () => { if (mode === "accuse") { if (!confirm("Are you sure? A wrong accusation means 2 turns on the naughty step.")) return; act({ t: "accuse", s: pickS, r: pickR, i: pickI }); } else act({ t: "guess", s: pickS, i: pickI }); mode = null; });
    on("#endturn", () => act({ t: "endturn" }));
    $$("[data-show]").forEach(b => b.onclick = () => act({ t: "show", c: b.dataset.show }));
    $$("[data-mark]").forEach(b => b.onclick = () => { const c = b.dataset.mark; if (known()[c]) return; marks[c] = !marks[c]; ls.set("mys_marks" + SLOT, marks); lastKey = ""; render(); });
    $$("[data-say]").forEach(b => b.onclick = () => say(b.dataset.say));
    on("#sayit", () => { const sol = S.sol; say(M.st(S).reveal(M.card(S, sol.s).name, M.card(S, sol.r).name, M.card(S, sol.i).name)); });
    on("#gear", () => { const d = document.createElement("div"); d.className = "sheet"; d.innerHTML = `<div><h3 style="margin:0">⚙️ Host controls</h3><button class="btn big" data-h="pause">${S.paused ? "▶️ Carry on" : "⏸️ Pause"}</button><button class="btn big" data-h="nudge">⏭ Move a stuck turn along</button><button class="btn big" data-h="endnow">🏳️ Give up and reveal the answer</button><button class="btn big gold" data-h="x">Close</button></div>`; document.body.appendChild(d); d.onclick = e => { const b = e.target.closest("[data-h]"); if (e.target === d || (b && b.dataset.h === "x")) return d.remove(); if (!b) return; if (b.dataset.h === "endnow" && !confirm("Reveal the answer and end the game?")) return; act({ t: b.dataset.h }); d.remove(); }; });
  }
  // new mystery = fresh marks
  let lastStart = 0;
  setInterval(() => { if (S && S.startedAt && S.startedAt !== lastStart) { if (lastStart) { marks = {}; ls.set("mys_marks" + SLOT, marks); } lastStart = S.startedAt; } }, 1000);

  render();
  try { link = await connect(room, onMsg, () => { }); if (me) send({ t: "join", name: me.name, kid: me.kid }); }
  catch (e) { app.innerHTML = `<div class="home"><h2>Couldn't connect</h2><p class="muted">Check the internet and reload.</p></div>`; }
}
</script>
</body>
</html>

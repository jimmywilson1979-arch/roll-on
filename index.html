<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16351f">
<title>Roll On · Fortunes</title>
<meta name="description" content="Family board game on the TV. Phones are your dice, your wallet and your cards.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roll On">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Fredoka:wght@600;700&family=Orbitron:wght@700;900&family=Nunito:wght@600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="themes.js?v=3"></script>
<script src="engine.js?v=3"></script>
<script src="art.js?v=1"></script>
<style>
:root{
  --felt:#16351f; --felt2:#0b1f12; --board:#f1e4c0; --board2:#e6d3a2; --ink:#2b1d0e; --accent:#e0b23e; --accent-ink:#2a1b00;
  --panel:rgba(0,0,0,.32); --line:rgba(255,255,255,.14); --fg:#fff8e8; --muted:#d9cba5; --good:#3ddc84; --bad:#ff5d5d;
  --title:"Cinzel",Georgia,serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body.th-city{--felt:#18283a;--felt2:#0c1520;--board:#eef2ec;--board2:#d9e2d6;--ink:#1c2a21;--accent:#ffcf3f;--accent-ink:#2b2100;--muted:#b9c7d6;--title:"Fredoka",system-ui,sans-serif}
body.th-space{--felt:#0b0e2a;--felt2:#04051a;--board:#1f2558;--board2:#161b45;--ink:#eef0ff;--accent:#7df9ff;--accent-ink:#00262a;--muted:#a9b2ea;--title:"Orbitron",system-ui,sans-serif}
body.th-northpole{--felt:#7c1424;--felt2:#4a0a14;--board:#f5fbff;--board2:#dcecf6;--ink:#173a2a;--accent:#ffd34d;--accent-ink:#3a2600;--muted:#f5c9cf;--title:"Fredoka",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt2) 75%);color:var(--fg);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow:hidden}
body.ph{overflow:auto}
body.tvb{display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--fg);background:rgba(0,0,0,.3);border:2px solid var(--line);border-radius:12px;padding:.8em .9em;width:100%;min-width:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.ttl{font-family:var(--title);font-weight:900;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border-radius:14px;padding:.75em 1.1em;font-weight:800;font-size:1rem;background:rgba(255,255,255,.08);border:2px solid var(--line);text-align:center;line-height:1.15}
.btn.gold{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#04210f;border-color:var(--good)}
.btn.bad{background:var(--bad);color:#2a0000;border-color:var(--bad)}
.btn.big{font-size:1.2rem;padding:.95em 1.2em;width:100%}
.btn.sm{padding:.45em .7em;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.42em .75em;border-radius:99px;border:2px solid var(--line);background:rgba(0,0,0,.25);font-weight:800;font-size:.88rem}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.setrow{display:flex;flex-wrap:wrap;gap:.35em;align-items:center;margin:.3em 0}
.setrow b{width:100%;font-size:.8em;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.tokdot{display:inline-grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;font-size:1em;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.8),0 2px 6px rgba(0,0,0,.5)}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:.6em 1.1em;border-radius:99px;font-weight:900;z-index:99;animation:pop .25s;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw;text-align:center}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}

/* ---------- home ---------- */
.home{max-width:520px;margin:0 auto;padding:calc(6*var(--vh,1vh)) 1.2em 2em;display:flex;flex-direction:column;gap:1em;min-height:calc(100*var(--vh,1vh))}
.home h1{font-family:var(--title);font-size:clamp(2.4rem,9vw,3.6rem);margin:.1em 0 0;line-height:1;text-align:center}
.home h1 small{display:block;font-size:.38em;letter-spacing:.3em;color:var(--accent);margin-bottom:.4em}
.gamecard{border:2px solid var(--line);border-radius:18px;padding:1em;background:var(--panel)}
.gamecard.soon{opacity:.55}
.gamecard h3{margin:.1em 0 .3em;font-family:var(--title)}
body.home-b{overflow:auto}

/* ---------- TV ---------- */
.tv{display:grid;grid-template-columns:auto 1fr;height:calc(100*var(--vh,1vh));width:100vw;gap:calc(1.6*var(--vh,1vh));padding:calc(1.6*var(--vh,1vh))}
.bwrap{position:relative;width:var(--bs,94vh);height:var(--bs,94vh)}
.board{position:absolute;inset:0;display:grid;grid-template-columns:1.5fr repeat(8,1fr) 1.5fr;grid-template-rows:1.5fr repeat(8,1fr) 1.5fr;gap:.25vh;background:var(--ink);border:.5vh solid var(--ink);border-radius:calc(1.2*var(--vh,1vh));box-shadow:0 calc(2*var(--vh,1vh)) calc(6*var(--vh,1vh)) rgba(0,0,0,.55)}
.sq{position:relative;background:var(--board);color:var(--ink);display:flex;overflow:hidden;font-size:calc(1.22*var(--vh,1vh));line-height:1.1;font-weight:800}
.sq .band{flex:none;display:flex;align-items:center;justify-content:center;gap:.1vh;font-size:calc(1.5*var(--vh,1vh));line-height:1}
.sq .tx{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:.3vh .35vh;gap:.3vh;min-width:0}
.sq .nm{overflow-wrap:anywhere}
.sq .pr{font-weight:900;opacity:.75;font-size:calc(1.15*var(--vh,1vh))}
.sq.b{flex-direction:column}.sq.b .band{height:22%}
.sq.t{flex-direction:column-reverse}.sq.t .band{height:22%}
.sq.l{flex-direction:row-reverse}.sq.l .band{width:22%;flex-direction:column}
.sq.r{flex-direction:row}.sq.r .band{width:22%;flex-direction:column}
.sq .ic{font-size:calc(3.2*var(--vh,1vh));line-height:1}
.sq.corner{background:var(--board2)}
.sq.corner .ic{font-size:calc(4.6*var(--vh,1vh))}
.sq.corner .nm{font-size:calc(1.45*var(--vh,1vh));font-family:var(--title)}
.sq.owned{box-shadow:inset 0 0 0 .45vh var(--oc)}
.sq .own{position:absolute;right:.3vh;bottom:.3vh;width:calc(2.2*var(--vh,1vh));height:calc(2.2*var(--vh,1vh));border-radius:50%;display:grid;place-items:center;font-size:calc(1.3*var(--vh,1vh));background:var(--oc);box-shadow:0 0 0 .2vh #fff}
.sq.l .own{left:.3vh;right:auto}
.sq.mort .tx,.sq.mort .band{opacity:.35}
.sq.mort::after{content:"MORTGAGED";position:absolute;inset:auto 0 42% 0;text-align:center;font-size:calc(1*var(--vh,1vh));font-weight:900;color:#a40000;transform:rotate(-18deg);letter-spacing:.08em}
.sq.hl{animation:hl 1s ease-in-out infinite alternate}
@keyframes hl{to{background:#fff6b8}}
body.th-space .sq.hl{animation-name:hls}@keyframes hls{to{background:#3b4aa8}}
.center{grid-area:2/2/10/10;background:linear-gradient(160deg,var(--board),var(--board2));color:var(--ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(2*var(--vh,1vh));text-align:center;overflow:hidden}
.logo{font-family:var(--title);font-weight:900;font-size:calc(6*var(--vh,1vh));line-height:.9;letter-spacing:.03em;text-shadow:0 .3vh 0 rgba(0,0,0,.12)}
.logo small{display:block;font-size:.36em;letter-spacing:.32em;opacity:.7;margin-top:.5vh}
.stage{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1.4*var(--vh,1vh));min-height:0}
.stage .msg{font-size:calc(2.6*var(--vh,1vh));font-weight:900}
.stage .sub{font-size:calc(1.9*var(--vh,1vh));font-weight:700;opacity:.8}
.qrbox{background:#fff;padding:calc(1.4*var(--vh,1vh));border-radius:calc(1.4*var(--vh,1vh));display:inline-block;box-shadow:0 calc(1*var(--vh,1vh)) calc(3*var(--vh,1vh)) rgba(0,0,0,.25)}
.qrbox img,.qrbox canvas{display:block;width:calc(30*var(--vh,1vh))!important;height:calc(30*var(--vh,1vh))!important}
.dice{display:flex;gap:calc(2*var(--vh,1vh));justify-content:center}
.die{width:calc(9*var(--vh,1vh));height:calc(9*var(--vh,1vh));border-radius:calc(1.6*var(--vh,1vh));background:#fff;box-shadow:inset 0 -.6vh 0 rgba(0,0,0,.12),0 .8vh calc(1.6*var(--vh,1vh)) rgba(0,0,0,.3);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(1.2*var(--vh,1vh));border:.25vh solid rgba(0,0,0,.15)}
.die i{width:calc(1.9*var(--vh,1vh));height:calc(1.9*var(--vh,1vh));border-radius:50%;background:#1d1d1d;place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.rolling{animation:tumble .18s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(180deg) translateY(-1vh)}100%{transform:rotate(360deg) translateY(0)}}
.deed{width:calc(28*var(--vh,1vh));background:#fff;color:#1d1d1d;border-radius:calc(1*var(--vh,1vh));box-shadow:0 calc(1*var(--vh,1vh)) calc(3*var(--vh,1vh)) rgba(0,0,0,.3);overflow:hidden;border:.3vh solid #1d1d1d;font-size:calc(1.55*var(--vh,1vh));font-weight:700}
.deed .hd{padding:calc(1.1*var(--vh,1vh)) .8vh;font-weight:900;font-size:calc(2.1*var(--vh,1vh));color:#fff;text-shadow:0 .15vh 0 rgba(0,0,0,.35);line-height:1.1}
.deed .hd small{display:block;font-size:.6em;letter-spacing:.2em;opacity:.9}
.deed table{width:100%;border-collapse:collapse;margin:.6vh 0}
.deed td{padding:.25vh calc(1*var(--vh,1vh));text-align:left}
.deed td:last-child{text-align:right;font-weight:900}
.deed .ft{border-top:.2vh solid #ddd;padding:.6vh calc(1*var(--vh,1vh));font-size:calc(1.35*var(--vh,1vh));opacity:.75}
.bigcard{width:min(calc(46*var(--vh,1vh)),90%);background:#fffdf6;color:#222;border-radius:calc(1.6*var(--vh,1vh));padding:calc(2*var(--vh,1vh)) calc(2.4*var(--vh,1vh));box-shadow:0 calc(1.2*var(--vh,1vh)) calc(3*var(--vh,1vh)) rgba(0,0,0,.35);border:.4vh solid var(--accent);animation:flip .5s}
.bigcard .ci{font-size:calc(6*var(--vh,1vh));line-height:1}
.bigcard h4{margin:.4vh 0 calc(1*var(--vh,1vh));font-family:var(--title);font-size:calc(2.6*var(--vh,1vh))}
.bigcard p{margin:0;font-size:calc(2.3*var(--vh,1vh));font-weight:800;line-height:1.25}
@keyframes flip{from{transform:rotateY(90deg) scale(.7)}}
.timerbar{width:min(calc(46*var(--vh,1vh)),90%);height:calc(1.2*var(--vh,1vh));border-radius:99px;background:rgba(0,0,0,.15);overflow:hidden}
.timerbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.bidders{display:flex;gap:calc(1*var(--vh,1vh));flex-wrap:wrap;justify-content:center}
.bidders span{opacity:.3;font-size:calc(3*var(--vh,1vh))}.bidders span.in{opacity:1}
.toks{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;width:calc(3.4*var(--vh,1vh));height:calc(3.4*var(--vh,1vh));margin:-1.7vh 0 0 -1.7vh;border-radius:50%;display:grid;place-items:center;font-size:calc(2.2*var(--vh,1vh));transition:left .2s,top .2s;box-shadow:0 0 0 .3vh #fff,0 .6vh calc(1.2*var(--vh,1vh)) rgba(0,0,0,.55);z-index:3}
.tok.cur{width:calc(4.4*var(--vh,1vh));height:calc(4.4*var(--vh,1vh));margin:-2.2vh 0 0 -2.2vh;font-size:calc(2.8*var(--vh,1vh));z-index:4;animation:bob .9s ease-in-out infinite alternate}
.tok.jailed::after{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 .6vh,rgba(40,40,40,.85) .6vh .9vh)}
@keyframes bob{to{transform:translateY(-.6vh)}}
.side{display:flex;flex-direction:column;gap:calc(1.4*var(--vh,1vh));min-width:0;min-height:0}
.shead{display:flex;align-items:center;gap:calc(1.4*var(--vh,1vh))}
.shead .ttl{font-size:calc(3.2*var(--vh,1vh));line-height:1}
.shead .code{margin-left:auto;text-align:right;font-size:calc(1.6*var(--vh,1vh));color:var(--muted);font-weight:800}
.shead .code b{display:block;font-size:calc(3.6*var(--vh,1vh));color:var(--fg);letter-spacing:.12em;font-family:var(--title)}
.info{display:flex;gap:calc(1*var(--vh,1vh));flex-wrap:wrap}
.info span{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:.5vh calc(1.3*var(--vh,1vh));font-weight:800;font-size:calc(1.8*var(--vh,1vh))}
.info span.warn{background:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:.9vh}
.prow{display:flex;align-items:center;gap:calc(1.2*var(--vh,1vh));background:var(--panel);border:.25vh solid var(--line);border-radius:calc(1.4*var(--vh,1vh));padding:.9vh calc(1.3*var(--vh,1vh));font-size:calc(2*var(--vh,1vh));font-weight:800}
.prow.turn{border-color:var(--accent);background:rgba(255,255,255,.12)}
.prow.out{opacity:.4}
.prow .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pn small{display:block;font-size:.7em;color:var(--muted);font-weight:700}
.prow .cash{font-size:calc(2.6*var(--vh,1vh));font-weight:900}
.prow .tokdot{font-size:calc(2.2*var(--vh,1vh))}
.minis{display:flex;flex-wrap:wrap;gap:.3vh;margin-top:.4vh}
.minis i{width:calc(1.2*var(--vh,1vh));height:calc(1.2*var(--vh,1vh));border-radius:.25vh;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.minis i.m{opacity:.35}
.feed{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:.6vh;font-size:calc(1.75*var(--vh,1vh));font-weight:700;color:var(--muted);mask-image:linear-gradient(transparent,#000 35%)}
.feed div:last-child{color:var(--fg)}
.tvctl{display:flex;gap:.8vh;flex-wrap:wrap}
.tvctl .btn{font-size:calc(1.5*var(--vh,1vh));padding:.7vh calc(1.2*var(--vh,1vh))}
.lobbyside .panel{background:var(--panel);border:.25vh solid var(--line);border-radius:calc(1.6*var(--vh,1vh));padding:calc(1.6*var(--vh,1vh))}
.lobbyside{font-size:calc(1.8*var(--vh,1vh))}
.lobbyside .chip{font-size:calc(1.6*var(--vh,1vh))}
.flyers{position:absolute;left:50%;top:9%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.8vh;z-index:6;pointer-events:none;width:90%}
.flyer{background:var(--ink);color:var(--board);padding:calc(1*var(--vh,1vh)) calc(2*var(--vh,1vh));border-radius:99px;font-weight:900;font-size:calc(2.1*var(--vh,1vh));animation:fly 3.6s forwards;box-shadow:0 .8vh calc(2*var(--vh,1vh)) rgba(0,0,0,.35);white-space:nowrap}
@keyframes fly{0%{opacity:0;transform:translateY(calc(1*var(--vh,1vh))) scale(.8)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-2vh)}}
.podium{display:flex;align-items:flex-end;gap:calc(2*var(--vh,1vh));justify-content:center}
.podium .pp{display:flex;flex-direction:column;align-items:center;gap:.6vh;font-weight:900}
.podium .blk{width:calc(13*var(--vh,1vh));border-radius:calc(1*var(--vh,1vh)) calc(1*var(--vh,1vh)) 0 0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--title);font-size:calc(4*var(--vh,1vh))}
.awards{display:grid;grid-template-columns:1fr 1fr;gap:calc(1*var(--vh,1vh));width:100%;max-width:calc(70*var(--vh,1vh))}
.award{background:rgba(0,0,0,.08);border-radius:calc(1*var(--vh,1vh));padding:calc(1*var(--vh,1vh));font-size:calc(1.6*var(--vh,1vh));font-weight:800;text-align:left;display:flex;gap:calc(1*var(--vh,1vh));align-items:center}
.award .ai{font-size:calc(3*var(--vh,1vh))}
.paused{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10;font-family:var(--title);font-size:calc(7*var(--vh,1vh));color:#fff}
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow i{position:absolute;top:-2vh;border-radius:50%;background:#fff;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),calc(105*var(--vh,1vh)))}}
body.th-space .stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 70% 30%,#fff,transparent),radial-gradient(1px 1px at 85% 80%,#fff,transparent),radial-gradient(1px 1px at 50% 50%,#fff,transparent),radial-gradient(2px 2px at 20% 90%,#cdf,transparent),radial-gradient(1px 1px at 90% 10%,#fff,transparent);opacity:.7}

/* ---------- phone ---------- */
.pw{display:flex;flex-direction:column;min-height:calc(100*var(--vh,1vh));min-height:100dvh;max-width:560px;margin:0 auto}
.ptop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:.6em;padding:.7em .9em;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.ptop .nm{font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptop .cash{font-weight:900;font-size:1.45rem}
.ptop .gear{font-size:1.3rem;padding:.1em .3em}
.pmain{flex:1;padding:1em .9em 6.5em;display:flex;flex-direction:column;gap:.9em}
.ptabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(0,0,0,.6);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.ptabs button{flex:1;padding:.75em .2em .8em;font-weight:800;font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.1em;position:relative}
.ptabs button b{font-size:1.4rem}
.ptabs button.on{color:var(--fg);background:rgba(255,255,255,.08)}
.ptabs .badge{position:absolute;top:.35em;right:28%;background:var(--bad);color:#fff;border-radius:99px;font-size:.7rem;padding:.05em .45em}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:1em}
.card.hot{border-color:var(--accent)}
.card.red{border-color:var(--bad);background:rgba(120,0,0,.35)}
.card h2{margin:0 0 .3em;font-size:1.35rem}
.card h3{margin:0 0 .4em;font-size:1.05rem}
.center-c{text-align:center}
.bigemoji{font-size:4.5rem;line-height:1.1}
.help{background:rgba(255,230,120,.14);border:2px dashed var(--accent);border-radius:14px;padding:.7em .8em;font-weight:700;font-size:.95rem}
.pdice{display:flex;gap:1em;justify-content:center;margin:.4em 0}
.pdice .die{width:5.2rem;height:5.2rem;border-radius:1rem;padding:.75rem}
.pdice .die i{width:1.05rem;height:1.05rem}

/* ---------- 🎨 Storybook look (html.fx). Classic look = without .fx ---------- */
.art{display:block}
.sq .ic .art{width:1.35em;height:1.35em}
.sq.corner .ic .art{width:1.5em;height:1.5em}

<body>
<div id="app"></div>
<script>
// =====================================================================
// Roll On — TV + phone screens.
// Same set-up as Buzz In: the TV runs the game, phones scan to join,
// live sync over Supabase Realtime (broadcast only, nothing stored).
// Add &local=1 to test with several tabs on one computer.
// =====================================================================
const SUPA_URL = "https://uqwlmegbelyqtbegxqlz.supabase.co";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxd2xtZWdiZWx5cXRiZWd4cWx6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTYzNzAsImV4cCI6MjEwNzMzMjM3MH0.bSeF8_kwKqSrEj3n8Ku2OeSU8E5nMqJj0hcfgXb8cW0";
const E = window.Engine, BOARD = E.BOARD, GROUPS = E.GROUPS;
const P = new URLSearchParams(location.search);
const LOCAL = P.has("local");
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }, del(k) { try { localStorage.removeItem(k); } catch (e) { } } };
const code4 = () => Array.from({ length: 4 }, () => "BCDFGHJKLMNPQRSTVWXZ"[Math.random() * 20 | 0]).join("");
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) { } };
const fmtN = n => Number(n).toLocaleString("en-GB");
const tok = (S, p) => E.theme(S).tokens[p.ci % 8];
// 🎨 Storybook art (art.js) when the look is on, otherwise the emoji
const art = (theme, slot, fallback) => (window.ART && ART.icon(theme, slot)) || fallback;
const cardArt = (theme, emoji) => (window.ART && ART.card(theme, emoji)) || emoji;
const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
const dieHTML = (n, cls) => `<div class="die ${cls || ""}">${Array.from({ length: 9 }, (_, i) => `<i class="${PIPS[n].includes(i) ? "on" : ""}"></i>`).join("")}</div>`;
function toast(t, ms) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 1800); }

// Size everything to the space you can actually see (tablet browsers lose some height to the address bar)
function fit() {
  const vv = window.visualViewport, H = vv ? vv.height : innerHeight, W = vv ? vv.width : innerWidth, r = document.documentElement.style;
  let u = H / 100;
  if (document.body.classList.contains("tvb")) { const bs = Math.min(H * .968, W * .6); u = bs / 96.8; r.setProperty("--bs", bs + "px"); }
  r.setProperty("--vh", u + "px");
}
addEventListener("resize", fit); addEventListener("orientationchange", () => setTimeout(fit, 300));
if (window.visualViewport) visualViewport.addEventListener("resize", fit);
const canFull = () => !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function goFull() { const d = document.documentElement; if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; } (d.requestFullscreen || d.webkitRequestFullscreen).call(d).catch?.(() => { }); }
document.addEventListener("fullscreenchange", () => setTimeout(fit, 200));

function setTheme(key) {
  ["kingdom", "city", "space", "northpole"].forEach(k => document.body.classList.toggle("th-" + k, k === key));
  const mc = document.querySelector('meta[name="theme-color"]'); if (mc) mc.content = getComputedStyle(document.body).getPropertyValue("--felt").trim() || "#16351f";
  let sn = document.querySelector(".snow");
  if (key === "northpole") { if (!sn) { sn = document.createElement("div"); sn.className = "snow"; for (let i = 0; i < 50; i++) { const z = 3 + Math.random() * 6, el = document.createElement("i"); el.style.cssText = `left:${Math.random() * 100}vw;width:${z}px;height:${z}px;--dx:${(Math.random() - .5) * 12}vw;animation-duration:${9 + Math.random() * 10}s;animation-delay:-${Math.random() * 18}s;opacity:${.3 + Math.random() * .5}`; sn.appendChild(el); } document.body.prepend(sn); } }
  else if (sn) sn.remove();
  let st = document.querySelector(".stars");
  if (key === "space") { if (!st) { st = document.createElement("div"); st.className = "stars"; document.body.prepend(st); } } else if (st) st.remove();
}

// deed (title card) for a property or station
function deedHTML(S, i, cls) {
  const b = BOARD[i], t = E.theme(S), m = n => E.money(S, n);
  if (b.t === "station") return `<div class="${cls}"><div class="hd" style="background:#333"><small>${esc(t.icons.station)} TRAVEL</small>${esc(E.sqName(S, i))}</div>
    <table><tr><td>Price</td><td>${m(b.price)}</td></tr>${E.STATION_RENT.map((r, k) => `<tr><td>Rent if ${k + 1} owned</td><td>${m(r)}</td></tr>`).join("")}</table><div class="ft">Mortgage value ${m(b.price / 2)}</div></div>`;
  const G = GROUPS[b.g];
  return `<div class="${cls}"><div class="hd" style="background:${G.c}"><small>${esc(G.name.toUpperCase())}</small>${esc(E.sqName(S, i))}</div>
    <table><tr><td>Price</td><td>${m(b.price)}</td></tr><tr><td>Rent</td><td>${m(b.rent[0])}</td></tr><tr><td>With full set</td><td>${m(b.rent[0] * 2)}</td></tr>
    ${[1, 2, 3, 4].map(h => `<tr><td>With ${h} ${esc(t.house.i)}</td><td>${m(b.rent[h])}</td></tr>`).join("")}<tr><td>With a ${esc(t.hotel.n)} ${esc(t.hotel.i)}</td><td>${m(b.rent[5])}</td></tr></table>
    <div class="ft">Each ${esc(t.house.n)} costs ${m(b.house)} · Mortgage ${m(b.price / 2)}</div></div>`;
}
const RULES = S => {
  const t = E.theme(S), m = n => E.money(S, n);
  return `<details class="rules"><summary>📖 How to play</summary><ul>
  <li>Everyone starts with ${m(1500)}. On your turn, <b>shake your phone</b> (or tap) to roll.</li>
  <li>Land on a place nobody owns: <b>buy it</b>, or it goes to a <b>secret auction</b> where everyone bids on their phone.</li>
  <li>Land on someone else's place: pay them rent. Own a whole colour set and rent doubles, then build ${esc(t.house.n)}s ${esc(t.house.i)} and a ${esc(t.hotel.n)} ${esc(t.hotel.i)} for much bigger rent.</li>
  <li>Pass ${esc(t.start)} to collect ${m(200)}. Doubles roll again, but three doubles sends you to ${esc(t.jail)}.</li>
  <li>${esc(t.chance.icon)} ${esc(t.chance.name)} and ${esc(t.quest.icon)} ${esc(t.quest.name)} cards bring luck, bills, and fun tasks (impressions, mimes, tongue twisters) for bonus ${esc(t.moneyWord)}.</li>
  <li>Trade places and ${esc(t.moneyWord)} with anyone, any time, from the Trade tab. Short of money? Mortgage places in My lands.</li>
  <li>${esc(E.endText(S.settings))}. Your fortune = ${esc(t.moneyWord)} + places + buildings.</li></ul></details>`;
};

// ===== Transport (same as Buzz In) =====
async function connect(room, onMsg, onStatus) {
  if (LOCAL) {
    const bc = new BroadcastChannel("rollon-" + room);
    bc.onmessage = e => onMsg(e.data);
    onStatus && onStatus("ok");
    return { send: m => bc.postMessage(m) };
  }
  const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, { realtime: { params: { eventsPerSecond: 30 } } });
  const ch = sb.channel("rollon-" + room, { config: { broadcast: { self: false } } });
  ch.on("broadcast", { event: "m" }, ({ payload }) => onMsg(payload));
  await new Promise((res, rej) => {
    let done = false;
    ch.subscribe(st => {
      if (st === "SUBSCRIBED") { onStatus && onStatus("ok"); if (!done) { done = true; res(); } }
      else if (st === "CHANNEL_ERROR" || st === "TIMED_OUT" || st === "CLOSED") { onStatus && onStatus("lost"); if (!done) { done = true; rej(new Error(st)); } }
    });
  });
  return { send: m => ch.send({ type: "broadcast", event: "m", payload: m }) };
}

// ===== Sounds (TV) =====
const SFX = (() => {
  let ac = null, on = ls.get("rollon_sound", true);
  const ctx = () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } if (ac && ac.state === "suspended") ac.resume(); return ac; };
  const tone = (f, d, type, vol, at) => { const a = ctx(); if (!a || !on) return; const t0 = a.currentTime + (at || 0), o = a.createOscillator(), g = a.createGain(); o.type = type || "sine"; o.frequency.setValueAtTime(f, t0); g.gain.setValueAtTime(vol || .15, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + d); o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + d + .02); };
  const click = at => { const a = ctx(); if (!a || !on) return; const b = a.createBuffer(1, 2200, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); const s = a.createBufferSource(), g = a.createGain(); g.gain.value = .5; s.buffer = b; s.connect(g); g.connect(a.destination); s.start(a.currentTime + (at || 0)); };
  return {
    get on() { return on; }, toggle() { on = !on; ls.set("rollon_sound", on); if (on) ctx(); return on; }, unlock() { ctx(); },
    dice() { for (let i = 0; i < 9; i++) click(i * .09 + Math.random() * .04); },
    step() { tone(660, .06, "triangle", .06); },
    coin() { tone(988, .08, "square", .06); tone(1319, .25, "square", .06, .08); },
    pay() { tone(392, .12, "triangle", .12); tone(262, .25, "triangle", .12, .1); },
    card() { tone(523, .1, "sine", .12); tone(784, .2, "sine", .12, .1); },
    jail() { tone(196, .2, "sawtooth", .08); tone(147, .4, "sawtooth", .08, .2); },
    build() { tone(440, .07, "square", .05); tone(554, .07, "square", .05, .08); tone(659, .15, "square", .05, .16); },
    fanfare() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? .7 : .18, "triangle", .14, i * .17)); },
    turn() { tone(880, .1, "sine", .08); },
  };
})();

// ===== Router =====
if (P.has("tv")) tvMain();
else if (P.has("join")) phoneMain(P.get("join"));
else home();

function home() {

          <div class="row2"><button class="btn good big" data-qd="1">✅ Someone guessed it</button><button class="btn bad big" data-qd="0">❌ Nobody got it</button></div><button class="btn" data-qskip="1" style="margin-top:.6em;width:100%">Skip this task</button></div>`);
        else out.push(`<div class="card hot"><h2>${q.icon} Your ${esc(q.title)}!</h2><div class="secret" style="font-size:1.4rem">${esc(q.txt)}</div><p class="muted">Do it now! Everyone else votes 👍 or 👎. Win ${m(q.reward)} if most say 👍.</p>${q.ready ? `<p class="center-c"><b>Waiting for the votes…</b></p>` : `<button class="btn gold big" data-qd="1">I've done it, vote now!</button>`}<button class="btn" data-qskip="1" style="margin-top:.6em;width:100%">Skip this task</button></div>`);
      } else if (q.t === "perform") {
        out.push(`<div class="card hot"><h2>${q.icon} ${pname(q.pid)}'s ${esc(q.title)}</h2><div class="secret" style="font-size:1.3rem">${esc(q.txt)}</div>${q.votes[id] != null ? `<p class="center-c" style="font-weight:900">Thanks, your vote is in!</p>` : `<p class="muted center-c">Did they do it well?</p><div class="vote"><button class="btn good" data-vote="1">👍</button><button class="btn bad" data-vote="0">👎</button></div>`}</div>`);
      } else out.push(`<div class="card hot center-c"><div class="bigemoji">🤫</div><h2>${pname(q.pid)}'s secret ${esc(q.title)}</h2><p>${esc(q.cat || "")}… <b>Shout out what you think it is!</b></p></div>`);
      return out.join("");
    }
    if (myTurn) {
      if (S.step === "roll") {
        out.push(`<div class="card hot center-c"><h2>🎲 Your turn!</h2><div class="pdice ${motionOK ? "shake" : ""}" id="pdice">${dieHTML(S.dice[0])}${dieHTML(S.dice[1])}</div>
          ${p.jail ? `<p style="font-weight:800">You're in ${esc(t.jail)}. Roll a double to get out free${p.jail >= 3 ? " (last try, then you must pay)" : ""}, or:</p><div class="row2" style="margin-bottom:.6em"><button class="btn" id="jpay" ${p.cash < E.JAIL_FINE ? "disabled" : ""}>Pay ${m(E.JAIL_FINE)}</button>${p.esc.length ? `<button class="btn" id="jcard">Use free card</button>` : ""}</div>` : ""}
          <button class="btn gold big" id="roll">Tap to roll</button><p class="muted" style="margin:.5em 0 0">…or give your phone a shake!</p></div>`);
      } else if (S.step === "moving") out.push(`<div class="card center-c"><div class="pdice">${dieHTML(S.dice[0])}${dieHTML(S.dice[1])}</div><h2>You rolled ${S.dice[0] + S.dice[1]}${S.dice[0] === S.dice[1] ? ", a double!" : ""}</h2><p class="muted">Watch the TV…</p></div>`);
      else if (S.step === "buy") {
        const b = BOARD[S.offer];
        out.push(`<div class="card hot"><h2>Buy ${esc(E.sqName(S, S.offer))}?</h2>${deedHTML(S, S.offer, "pdeed")}${adviceHTML() ? `<div style="margin-top:.7em">${adviceHTML()}</div>` : ""}
          <div class="row2" style="margin-top:.8em"><button class="btn gold big" id="buy" ${p.cash < b.price ? "disabled" : ""}>Buy ${m(b.price)}</button><button class="btn big" id="pass">🔨 Auction</button></div>
          ${p.cash < b.price ? `<p class="muted">Not enough ${esc(t.moneyWord)}. You can mortgage something in My lands first.</p>` : ""}</div>`);
      } else if (S.step === "card" && S.card) out.push(`<div class="card hot center-c"><div class="bigemoji">${S.card.icon}</div><h2>${esc(S.card.title)}</h2><p style="font-size:1.2rem;font-weight:800">${esc(S.card.txt)}</p><button class="btn gold big" id="cardok">OK</button></div>`);
      else if (S.step === "end") out.push(`<div class="card hot center-c"><h2>Anything else?</h2>${adviceHTML()}<p class="muted">Build, mortgage or trade now, or pass the dice on.</p><button class="btn gold big" id="endturn">End my turn ➜</button></div>`);
      else if (S.step === "debt") out.push(`<div class="card center-c"><div class="bigemoji">⏳</div><h2>Waiting for ${S.debts.map(d => pname(d.pid)).join(" and ")} to pay up…</h2></div>`);
    } else {
      const what = S.step === "buy" ? `is deciding whether to buy ${esc(E.sqName(S, S.offer))}` : S.step === "card" ? `drew a card: “${esc(S.card ? S.card.txt : "")}”` : S.step === "debt" ? `is waiting for money to be paid` : S.step === "moving" ? `rolled ${S.dice[0] + S.dice[1]}` : S.step === "end" ? "is finishing their turn" : "is about to roll";
      out.push(`<div class="card center-c"><div class="bigemoji">${tok(S, cur)}</div><h2>${pname(S.turnPid)}'s turn</h2><p class="muted" style="margin:0">${pname(S.turnPid)} ${what}.</p></div>`);
      out.push(`<div class="card"><b>You:</b> ${m(p.cash)} · ${E.mine(S, id).length} place${E.mine(S, id).length === 1 ? "" : "s"} · fortune ${m(E.netWorth(S, id))}${p.jail ? ` · ⛓️ in ${esc(t.jail)}` : ""}${p.esc.length ? ` · 🎟️ get-out-free card` : ""}</div>`);
      out.push(`<p class="muted center-c" style="margin:0">You can build, mortgage and trade while you wait.</p>`);
    }
    return out.join("");
  }
  function offerCard(x, incoming) {
    const lst = arr => arr.length ? arr.map(i => `<span class="chip" style="border-left:.6em solid ${BOARD[i].t === "station" ? "#333" : GROUPS[BOARD[i].g].c}">${esc(E.sqName(S, i))}</span>`).join(" ") : "";
    const a = incoming ? x.from : x.to;
    const youGet = incoming ? [lst(x.give), x.gc ? m(x.gc) : ""] : [lst(x.get), x.tc ? m(x.tc) : ""];
    const youGive = incoming ? [lst(x.get), x.tc ? m(x.tc) : ""] : [lst(x.give), x.gc ? m(x.gc) : ""];
    const f = arr => arr.filter(Boolean).join(" ") || "<span class='muted'>nothing</span>";
    return `<div class="card hot"><h3>🤝 ${incoming ? `${ptok(a)} ${pname(a)} offers you a trade` : `Your offer to ${ptok(a)} ${pname(a)}`}</h3>
      <p style="margin:.3em 0"><b>You get:</b> ${f(youGet)}</p><p style="margin:.3em 0 .7em"><b>You give:</b> ${f(youGive)}</p>
      ${incoming ? `<div class="row2"><button class="btn good" data-ans="${x.id}" data-ok="1">✅ Accept</button><button class="btn bad" data-ans="${x.id}" data-ok="0">✖ No thanks</button></div>` : `<p class="muted" style="margin:0 0 .5em">Waiting for ${pname(a)} to answer on their phone…</p><button class="btn" data-cancel="${x.id}" style="width:100%">Cancel offer</button>`}</div>`;
  }

  function landsHTML() {
    const p = mineP(), t = E.theme(S), mine = E.mine(S, id);
    if (!mine.length) return `<div class="card center-c"><div class="bigemoji">🗺️</div><h2>No places yet</h2><p class="muted">Land on a place nobody owns and buy it, or win it at auction.</p></div>`;
    const groups = [...new Set(mine.map(i => BOARD[i].t === "station" ? "s" : BOARD[i].g))];
    return groups.map(g => {
      const list = g === "s" ? mine.filter(i => BOARD[i].t === "station") : GROUPS[g].sq;
      const full = g !== "s" && E.groupOwner(S, g) === id;
      const head = g === "s" ? `${t.icons.station} Travel (${list.length} of 4)` : `${GROUPS[g].name}: ${mine.filter(i => BOARD[i].g === g && BOARD[i].t === "prop").length} of ${GROUPS[g].sq.length}${full ? " ⭐ full set!" : ""}`;
      return `<div class="card"><h3>${head}</h3>${list.map(i => {
        const o = S.own[i], b = BOARD[i], col = b.t === "station" ? "#555" : GROUPS[b.g].c;
        if (!o || o.o !== id) return `<div class="land" style="opacity:.45"><span class="sw" style="background:${col}"></span><div class="ln">${esc(E.sqName(S, i))}<small>${o ? "Owned by " + pname(o.o) : "Not owned yet"}</small></div></div>`;
        const acts = [];
        if (b.t === "prop" && full) { acts.push(`<button class="btn sm gold" data-mg="build" data-i="${i}" ${E.canBuild(S, id, i) ? "" : "disabled"}>+ ${o.h === 4 ? t.hotel.i + " " + esc(t.hotel.n) : t.house.i + " " + esc(t.house.n)} ${m(b.house)}</button>`); if (o.h) acts.push(`<button class="btn sm" data-mg="sell" data-i="${i}" ${E.canSell(S, id, i) ? "" : "disabled"}>Sell one +${m(b.house / 2)}</button>`); }
        if (o.m) acts.push(`<button class="btn sm" data-mg="unmortgage" data-i="${i}" ${E.canUnmortgage(S, id, i) ? "" : "disabled"}>Pay off mortgage ${m(E.unmortCost(i))}</button>`);
        else acts.push(`<button class="btn sm" data-mg="mortgage" data-i="${i}" ${E.canMortgage(S, id, i) ? "" : "disabled"}>Mortgage +${m(E.mortVal(i))}</button>`);
        return `<div class="land ${o.m ? "m" : ""}"><span class="sw" style="background:${col}"></span><div class="ln">${esc(E.sqName(S, i))} ${o.h ? (o.h === 5 ? t.hotel.i : t.house.i.repeat(o.h)) : ""}<small>${o.m ? "Mortgaged, no rent" : "Rent now " + m(E.rentOf(S, i))}</small></div><div class="acts">${acts.join("")}</div></div>`;
      }).join("")}${full && !list.some(i => S.own[i].h) ? `<p class="muted" style="margin:.5em 0 0;font-size:.85rem">Build evenly: every place in a set needs a ${esc(t.house.n)} before any gets a second.</p>` : ""}</div>`;
    }).join("") + `<p class="muted center-c" style="font-size:.85rem">Mortgaged places charge no rent. You can't mortgage a set with buildings on it.</p>`;
  }

  function tradeHTML() {
    const mineOut = Object.values(S.trades).filter(x => x.from === id), incoming = Object.values(S.trades).filter(x => x.to === id), out = [];
    incoming.forEach(x => out.push(offerCard(x, true)));
    if (mineOut.length) { out.push(offerCard(mineOut[0], false)); return out.join(""); }
    const others = E.alive(S).filter(x => x !== id);
    if (!tr || !others.includes(tr.to)) tr = { to: null, give: [], get: [], gc: 0, tc: 0 };
    out.push(`<div class="card"><h3>🤝 Make a trade with…</h3><div class="pick">${others.map(x => `<button class="chip ${tr.to === x ? "on" : ""}" data-tto="${x}">${tok(S, S.players[x])} ${pname(x)}</button>`).join("")}</div></div>`);
    if (tr.to) {
      const p = mineP(), them = S.players[tr.to];
      const chips = (owner, sel, key) => { const list = E.mine(S, owner); return list.length ? list.map(i => { const ok = E.tradable(S, i); return `<button class="chip ${sel.includes(i) ? "on" : ""}" data-${key}="${i}" ${ok ? "" : "disabled title='Sell the buildings first'"} style="border-left-color:${BOARD[i].t === "station" ? "#333" : GROUPS[BOARD[i].g].c}">${esc(E.sqName(S, i))}${S.own[i].m ? " (mortgaged)" : ""}</button>`; }).join("") : `<span class="muted">No places</span>`; };
      const step = (k, max) => `<div class="stepper"><button class="btn sm" data-c="${k}" data-d="-100">−100</button><button class="btn sm" data-c="${k}" data-d="-10">−10</button><span class="val" style="font-size:1.4rem">${m(tr[k])}</span><button class="btn sm" data-c="${k}" data-d="10">+10</button><button class="btn sm" data-c="${k}" data-d="100">+100</button></div>`;
      out.push(`<div class="card"><h3>You give ${pname(tr.to)}</h3><div class="pick">${chips(id, tr.give, "tg")}</div><p class="muted" style="margin:.6em 0 .2em">Plus ${esc(E.theme(S).moneyWord)} (you have ${m(p.cash)})</p>${step("gc")}</div>`);
      out.push(`<div class="card"><h3>You get from ${pname(tr.to)}</h3><div class="pick">${chips(tr.to, tr.get, "tt")}</div><p class="muted" style="margin:.6em 0 .2em">Plus ${esc(E.theme(S).moneyWord)} (they have ${m(them.cash)})</p>${step("tc")}</div>`);
      const empty = !tr.give.length && !tr.get.length && !tr.gc && !tr.tc;
      out.push(`<button class="btn gold big" id="sendtr" ${empty ? "disabled" : ""}>Send offer to ${pname(tr.to)}</button><p class="muted center-c" style="margin:0;font-size:.85rem">They'll see it on their phone and can say yes or no.</p>`);
    }
    return out.join("");
  }

  function openSheet(kind) {
    sheet = kind; const d = document.createElement("div"); d.className = "sheet"; d.id = "sheet";
    d.innerHTML = `<div><h3 style="margin:0">⚙️ Host controls</h3>
      <button class="btn big" data-h="pause">${S.paused ? "▶ Carry on" : "⏸ Pause the game"}</button>
      <button class="btn big" data-h="nudge">⏭ Move a stuck turn along</button><p class="muted" style="margin:-.3em 0 0;font-size:.85rem">Rolls, auctions, or ends the turn for someone who's wandered off.</p>
      <button class="btn big" data-h="endnow">🏁 Finish now and count up fortunes</button>
      <button class="btn big gold" id="shclose">Close</button></div>`;
    document.body.appendChild(d);
    d.onclick = e => {
      if (e.target === d || e.target.id === "shclose") { sheet = null; d.remove(); return; }
      const h = e.target.closest("[data-h]"); if (!h) return;
      if (h.dataset.h === "endnow" && !confirm("Finish the game now?")) return;
      act({ t: h.dataset.h }); sheet = null; d.remove();
    };
  }

  function wire() {
    const on = (sel, f) => { const el = $(sel); if (el) el.onclick = f; };
    $$("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; lastKey = ""; render(); scrollTo(0, 0); });
    on("#gear", () => { $("#sheet") && $("#sheet").remove(); openSheet("host"); });
    on("#edit", () => { lastKey = ""; me = null; joinForm(); me = ls.get(KME, null); });
    on("#leave", () => { send({ t: "leave" }); ls.del(KME); me = null; lastKey = ""; render(); });
    on("#start", () => act({ t: "start" })); on("#again", () => act({ t: "again" })); on("#tolobby", () => act({ t: "lobby" }));
    $$("#sets [data-set]").forEach(b => b.onclick = () => { const v = b.dataset.val; act({ t: "set", k: b.dataset.set, v: v === "true" ? true : v === "false" ? false : isNaN(v) ? v : Number(v) }); });
    on("#roll", () => { askMotion(); doRoll(); });
    on("#jpay", () => act({ t: "jailpay" })); on("#jcard", () => act({ t: "jailcard" }));
    on("#buy", () => act({ t: "buy" })); on("#pass", () => act({ t: "pass" }));
    on("#cardok", () => act({ t: "cardok" })); on("#endturn", () => act({ t: "endturn" }));
    on("#auto", () => act({ t: "autoraise" }));
    on("#bust", () => { if (confirm("Give up and leave the game? Everything you own goes to whoever you owe.")) act({ t: "bankrupt" }); });
    $$("[data-b]").forEach(b => b.onclick = () => { bid = Math.max(0, Math.min(mineP().cash, bid + +b.dataset.b)); $("#bidv").textContent = m(bid); vib(8); });
    $$("[data-bset]").forEach(b => b.onclick = () => { bid = +b.dataset.bset; $("#bidv").textContent = m(bid); vib(8); });
    on("#bidgo", () => act({ t: "bid", a: bid }));
    $$("[data-qd]").forEach(b => b.onclick = () => act({ t: "qdone", ok: b.dataset.qd === "1" }));
    $$("[data-qskip]").forEach(b => b.onclick = () => { if (confirm("Skip this task? You won't get the reward.")) act({ t: "qdone", skip: true }); });
    $$("[data-vote]").forEach(b => b.onclick = () => act({ t: "vote", ok: b.dataset.vote === "1" }));
    $$("[data-mg]").forEach(b => b.onclick = () => act({ t: b.dataset.mg, i: +b.dataset.i }));
    $$("[data-ans]").forEach(b => b.onclick = () => act({ t: "answer", id: b.dataset.ans, ok: b.dataset.ok === "1" }));
    $$("[data-cancel]").forEach(b => b.onclick = () => act({ t: "cancel", id: b.dataset.cancel }));
    $$("[data-tto]").forEach(b => b.onclick = () => { tr = { to: b.dataset.tto, give: [], get: [], gc: 0, tc: 0 }; lastKey = ""; render(); });
    const tog = (arr, i) => { const k = arr.indexOf(i); k >= 0 ? arr.splice(k, 1) : arr.push(i); };
    $$("[data-tg]").forEach(b => b.onclick = () => { tog(tr.give, +b.dataset.tg); lastKey = ""; render(); });
    $$("[data-tt]").forEach(b => b.onclick = () => { tog(tr.get, +b.dataset.tt); lastKey = ""; render(); });
    $$("[data-c]").forEach(b => b.onclick = () => { const k = b.dataset.c, max = k === "gc" ? mineP().cash : S.players[tr.to].cash; tr[k] = Math.max(0, Math.min(max, tr[k] + +b.dataset.d)); lastKey = ""; render(); });
    on("#sendtr", () => { act(Object.assign({ t: "offer" }, tr)); tr = null; });
  }

  render();
  try {
    link = await connect(room, onMsg, st => { const w = $("#lost"); if (w) w.classList.toggle("hidden", st === "ok"); });
    if (me) { send({ t: "join", name: me.name, kid: me.kid }); joinedOnce = true; }
  } catch (e) { app.innerHTML = `<div class="home"><h2>Couldn't connect</h2><p class="muted">Check the internet and reload.</p></div>`; }
}
</script>
</body>
</html>
